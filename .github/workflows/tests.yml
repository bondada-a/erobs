name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pytest python3-yaml python3-numpy python3-opencv
      - run: ./test.sh pure

  ros:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install hardware-free test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git python3-colcon-common-extensions python3-pytest python3-yaml \
            python3-numpy python3-opencv python3-pyqt6 \
            ros-jazzy-ament-cmake-pytest ros-jazzy-ament-cmake-ros \
            ros-jazzy-launch-testing-ament-cmake \
            ros-jazzy-moveit-task-constructor-core ros-jazzy-moveit-servo \
            ros-jazzy-cv-bridge ros-jazzy-tf-transformations ros-jazzy-tf2-geometry-msgs \
            ros-jazzy-sensor-msgs-py ros-jazzy-octomap-msgs ros-jazzy-ur-msgs
      - name: Fetch interface sources only
        run: |
          git clone https://github.com/sixym3/pipettor.git /tmp/pipettor
          git -C /tmp/pipettor checkout 8f14bb019dd1e382f15848c113fd3ab701b03a0e
          git clone https://github.com/zivid/zivid-ros.git /tmp/zivid-ros
          git -C /tmp/zivid-ros checkout f4e169b5086a29442c79c11ddcbb56a03b583466
      - name: Build interfaces, configuration and test registration
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --base-paths src/beambot_interfaces src/custom-ur-descriptions/cms_moveit_config \
            /tmp/pipettor/pipette_driver /tmp/zivid-ros/zivid_interfaces \
            --cmake-args -DBUILD_TESTING=OFF
          source install/setup.bash
          colcon build --base-paths src/beambot src/beambot_gui --cmake-args -DBUILD_TESTING=ON
      - name: Run unit and isolated ROS integration tests
        run: ./test.sh all
      - name: Check colcon registration
        run: |
          source install/setup.bash
          export PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONDONTWRITEBYTECODE=1
          colcon test --packages-select beambot beambot_gui --return-code-on-test-failure
          colcon test-result --verbose
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            log/tests
            build/beambot/test_results
            build/beambot_gui/pytest.xml
